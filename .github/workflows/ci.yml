name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Install ripgrep (check:shippable needs rg)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm run check:shippable

  server-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests (KMS + Anthropic mocked, no network calls)
        working-directory: supabase/functions
        run: npm test
      - name: Typecheck shared code + tests
        working-directory: supabase/functions
        run: npx tsc -p tsconfig.json

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks binary
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tgz
      - name: Scan full history (redacted)
        run: gitleaks detect --source . --log-opts="--all" --redact --no-banner --verbose

  sql-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Test-only throwaway credentials for the CI service container. Not a secret, not used anywhere else.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only value for the disposable service container above (database name must end in _test).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fitness_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install psql client and contrib (pgcrypto)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client postgresql-contrib
      - name: Migrations + RLS tests on Postgres 17 with real pgcrypto
        run: node supabase/tests/run.mjs
