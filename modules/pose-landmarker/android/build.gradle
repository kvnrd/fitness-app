plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.poselandmarker'
version = '1.0.0'

android {
  namespace "expo.modules.poselandmarker"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  sourceSets {
    // One copy of pose_landmarker_lite.task, shared with iOS.
    main.assets.srcDirs += ['../ios/models']
  }
  androidResources {
    noCompress 'task'
  }
}

dependencies {
  // Google MediaPipe Tasks (Apache-2.0), same version as google-ai-edge/mediapipe-samples.
  implementation 'com.google.mediapipe:tasks-vision:1.2.2'
  def camerax = '1.5.3'
  implementation "androidx.camera:camera-core:${camerax}"
  implementation "androidx.camera:camera-camera2:${camerax}"
  implementation "androidx.camera:camera-lifecycle:${camerax}"
  implementation "androidx.camera:camera-view:${camerax}"
}
